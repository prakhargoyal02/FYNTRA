[theme]
base = "dark"
primaryColor = "#8CF0CB"
backgroundColor = "#080B0A"
secondaryBackgroundColor = "#101413"
textColor = "#F2F4EF"
borderColor = "#222B28"
font = "sans-serif"
baseRadius = "0.8rem"
buttonRadius = "0.7rem"
showWidgetBorder = false
showSidebarBorder = true
chartCategoricalColors = ["#8CF0CB", "#69D8A0", "#E2B66B", "#F08C83", "#83AAA0", "#7394A0"]

[theme.sidebar]
backgroundColor = "#0A0D0C"
secondaryBackgroundColor = "#101413"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
maxUploadSize = 10
