[theme]
base = "dark"
primaryColor = "#B5F3CF"
backgroundColor = "#0B1010"
secondaryBackgroundColor = "#121A19"
textColor = "#F3F3E9"
borderColor = "#273532"
font = "sans-serif"
baseRadius = "0.8rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = false
paddingTop = "1.5rem"
paddingBottom = "3rem"
chartCategoricalColors = ["#B5F3CF", "#F4B4A5", "#E7C887", "#8BADA1", "#7BB8CC", "#D4DBCB"]

[theme.sidebar]
backgroundColor = "#0B1010"
secondaryBackgroundColor = "#121A19"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
maxUploadSize = 10
