[theme]
base = "dark"
primaryColor = "#22B88A"
backgroundColor = "#0C1312"
secondaryBackgroundColor = "#151F1D"
textColor = "#F4F1E8"
borderColor = "#293D36"
font = "sans-serif"
baseRadius = "0.8rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#68E8B6", "#DCC58B", "#83A99E", "#3A8973", "#B2BDB4", "#6A8E9D"]
[theme.sidebar]
backgroundColor = "#101916"
secondaryBackgroundColor = "#1B2B24"
[client]
toolbarMode = "minimal"
[browser]
gatherUsageStats = false
[server]
headless = true
maxUploadSize = 10

