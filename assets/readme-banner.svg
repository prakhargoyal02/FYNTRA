    <g transform="translate(152)"><rect width="122" height="42" rx="21" fill="#13261e" stroke="#315d49"/><text x="61" y="27" text-anchor="middle" fill="#dff8e9">SQLite ledger</text></g>
    <g transform="translate(288)"><rect width="128" height="42" rx="21" fill="#13261e" stroke="#315d49"/><text x="64" y="27" text-anchor="middle" fill="#dff8e9">Streamlit UI</text></g>
    <g transform="translate(430)"><rect width="144" height="42" rx="21" fill="#13261e" stroke="#315d49"/><text x="72" y="27" text-anchor="middle" fill="#dff8e9">Supabase private</text></g>
  </g>

  <g transform="translate(880 78)">
    <rect width="420" height="340" rx="24" fill="#0d1915" stroke="#2a493b"/>
    <rect x="28" y="28" width="112" height="12" rx="6" fill="#223c31"/>
    <rect x="28" y="54" width="196" height="8" rx="4" fill="#173027"/>
    <g transform="translate(28 104)">
      <rect width="112" height="70" rx="14" fill="#12251d" stroke="#294b3a"/>
      <rect x="126" width="112" height="70" rx="14" fill="#12251d" stroke="#294b3a"/>
      <rect x="252" width="112" height="70" rx="14" fill="#12251d" stroke="#294b3a"/>
      <rect x="14" y="15" width="42" height="7" rx="3.5" fill="#315d49"/>
      <rect x="14" y="36" width="70" height="11" rx="5.5" fill="#b5f3cf"/>
      <rect x="140" y="15" width="42" height="7" rx="3.5" fill="#315d49"/>
      <rect x="140" y="36" width="58" height="11" rx="5.5" fill="#f2cf8d"/>
      <rect x="266" y="15" width="42" height="7" rx="3.5" fill="#315d49"/>
      <rect x="266" y="36" width="64" height="11" rx="5.5" fill="#8ee3ba"/>
    </g>
    <path d="M40 275 C85 245 108 288 150 252 S221 207 262 226 S330 176 382 188" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="520" filter="url(#tinyGlow)">
      <animate attributeName="stroke-dashoffset" values="520;0;0" keyTimes="0;0.55;1" dur="5.8s" repeatCount="indefinite"/>
    </path>
    <g fill="#b5f3cf" filter="url(#tinyGlow)">
      <circle cx="150" cy="252" r="5"><animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="262" cy="226" r="5"><animate attributeName="r" values="4;7;4" dur="2.5s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="382" cy="188" r="5"><animate attributeName="r" values="4;7;4" dur="2.5s" begin="1.6s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="28" y="306" width="84" height="7" rx="3.5" fill="#244438"/>
    <rect x="126" y="306" width="122" height="7" rx="3.5" fill="#183228"/>
