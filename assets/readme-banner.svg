<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-label="FYNTRA personal finance workspace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100d"/>
      <stop offset="0.55" stop-color="#0b1712"/>
      <stop offset="1" stop-color="#08110e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#79e6b0" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#79e6b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63c894"/>
      <stop offset="0.55" stop-color="#b5f3cf"/>
      <stop offset="1" stop-color="#74d8aa"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#b5f3cf" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="tinyGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="520" rx="28" fill="url(#grid)"/>
  <circle cx="1110" cy="210" r="250" fill="url(#glow)" filter="url(#soft)">
    <animate attributeName="r" values="225;270;225" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.65;1;0.65" dur="8s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(70 62)">
    <rect x="0" y="0" width="68" height="68" rx="20" fill="#13261e" stroke="#3d765c"/>
    <path d="M14 44V29a16 16 0 0 1 16-16h25L42 26H31a4 4 0 0 0-4 4v14L14 57Z" fill="#b5f3cf"/>
    <path d="M32 35h20L40 48H19l13-13Z" fill="#6dc7a0"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="160" y="104" fill="#f3f3e9" font-size="34" font-weight="700" letter-spacing="7">FYNTRA</text>
    <text x="70" y="210" fill="#f3f3e9" font-size="54" font-weight="650" letter-spacing="-1.5">Know where your money goes.</text>
    <text x="70" y="276" fill="#b5f3cf" font-size="54" font-weight="650" letter-spacing="-1.5">Decide where it goes next.</text>
    <text x="72" y="334" fill="#93a99f" font-size="17" letter-spacing="1.8">PERSONAL FINANCE · CLEAR LEDGERS · USEFUL DECISIONS</text>
  </g>

  <g transform="translate(72 382)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">
