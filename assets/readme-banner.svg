  <g opacity="0.72">
    <circle cx="1270" cy="455" r="3" fill="#b5f3cf"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1322" cy="430" r="2.5" fill="#6dc7a0"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1220" cy="474" r="2" fill="#f2cf8d"><animate attributeName="opacity" values="0.25;1;0.25" dur="5s" repeatCount="indefinite"/></circle>
  </g>
